name: Attestation Health Check

on:
  schedule:
    - cron: '23 3 * * 1'  # Weekly Monday 3:23am UTC
  workflow_dispatch:

jobs:
  verify:
    name: Verify Latest Release Attestations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Get latest release tag
        id: release
        run: |
          # "the lookup failed" and "there are no releases" are different facts and
          # must not share an exit path. The old `2>/dev/null || echo ""` collapsed
          # an API hiccup or a bad token into the same green "skipping" as a repo
          # with no releases at all, so a week of attestation verification could go
          # un-run and still report success — indistinguishable from healthy.
          # `// empty` keeps the genuinely-empty list an empty TAG without relying
          # on how gh renders a null jq result.
          if ! TAG=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName // empty'); then
            echo "::error::gh release list failed for $REPO — cannot determine the latest release; refusing to report a green skip"
            exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "$REPO has no published releases — nothing to attest, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Latest release: $TAG"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}

      - name: Set up Python
        if: steps.release.outputs.skip != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Verify attestations
        if: steps.release.outputs.skip != 'true'
        run: |
          # `gh attestation` has no `list` subcommand — the old query errored in
          # ~8s every run (that was the real cause of the weekly red, not missing
          # attestations). Verify the actual published artifact instead.
          VER="${{ steps.release.outputs.tag }}"
          VER="${VER#v}"
          echo "Verifying attestations for cachekit ${VER}"
          mkdir -p attest-check
          if ! pip download "cachekit==${VER}" --no-deps --only-binary :all: -d attest-check; then
            echo "::error::Could not download wheel for ${VER} from PyPI"
            exit 1
          fi
          shopt -s nullglob
          files=(attest-check/*.whl)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No wheel downloaded for ${VER}"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Verifying attestation for $f"
            gh attestation verify "$f" --repo ${{ github.repository }} || {
              echo "::error::Attestation verification failed for $f"
              exit 1
            }
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open issue on failure
        if: failure()
        run: |
          gh issue create \
            --repo ${{ github.repository }} \
            --title "Attestation verification failed for ${{ steps.release.outputs.tag }}" \
            --body "Weekly attestation health check failed. Verify that the release workflow produced valid attestations." \
            --label "bug"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
